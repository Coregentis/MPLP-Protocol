  - "governance/03-distribution/sdk/MPGC_APPROVAL_SDKR_v1.0.md"
  - "governance/03-distribution/sdk/VERSION_REGISTRY.yaml"
  - "governance/04-records/A-LINE-CLOSURE-CANDIDATE-2026-04-01.md"
  - "governance/04-records/A-LINE-CLOSURE-RECORD-2026-04-01.md"
  - "governance/04-records/AUDIT-ARTIFACT-ARCHIVE-2026-04-01.md"
