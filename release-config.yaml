# MPLP repository release bundle config
#
# Canonical outward-facing release meaning uses explicit version domains.
# The bare `version` field below is retained only for build-release.js
# compatibility and mirrors the frozen protocol line for this repository bundle.

protocol_version: "1.0.0"
schema_bundle_version: "2.0.0"
invariant_bundle_version: "2.0.0"
validation_ruleset_version: "ruleset-1.0"
validation_lab_release_version: "1.0.1"
docs_release_version: "1.0.0"
website_release_version: "1.0.0"

version: "1.0.0"

public_oss_projection_policy:
  model: "clean-single-version-public-oss-projection"
  source_authority: "Coregentis/MPLP-Protocol-Dev"
  target_projection_repo: "Coregentis/MPLP-Protocol"
  generated_bundle: "dist/mplp-v1.0"
  release_config_role: "positive allowlist plus denylist for the generated OSS bundle"
  authorization_boundary:
    config_is_authorization: false
    public_repo_mutation_requires_owner_authorization: true
    registry_mutation_requires_separate_owner_authorization: true
    tag_release_branch_cleanup_requires_separate_owner_authorization: true
  public_repo_version_policy:
    long_term_branches:
      - "main"
    temporary_projection_branches: "at most one clean projection PR branch per authorized execution"
    codex_process_branches_in_public_repo: "forbidden by default"
    retained_public_versions: "owner must choose exact tag/release before cleanup execution"
  package_registry_release_scope:
    npm_public_packages:
      - "@mplp/schema"
      - "@mplp/conformance"
      - "@mplp/core"
      - "@mplp/coordination"
      - "@mplp/integration-llm-http"
      - "@mplp/integration-storage-fs"
      - "@mplp/integration-storage-kv"
      - "@mplp/integration-tools-generic"
      - "@mplp/modules"
      - "@mplp/runtime-minimal"
      - "@mplp/sdk-ts"
      - "@mplp/devtools"
    pypi_public_packages:
      - "mplp-sdk"
    excluded_packages:
      "@mplp/compliance": "deprecated legacy alias; not projected as active public package"
      "@mplp/validator": "internal CI/validation tooling; not projected as active public package"
  generated_artifact_boundary:
    repository_projection_dist: "generate dist/mplp-v1.0 from this config, then use that bundle as the public OSS projection candidate"
    package_dist_directories: "excluded by default; npm/PyPI registries carry package artifacts"
    package_dist_public_repo_exception: "requires a separate owner decision and package-surface allowlist"
  governance_projection_boundary:
    public_governance_layers: "constitutional, methods, distribution, selected records, versioning, and public identity/disambiguation"
    dev_process_governance: "excluded from public OSS projection"
    raw_publish_or_credential_evidence: "excluded from public OSS projection"

include:
  # Root public OSS identity and contribution files.
  - "README.md"
  - "CHANGELOG.md"
  - "LICENSE.txt"
  - "CODE_OF_CONDUCT.md"
  - "CONTRIBUTING.md"
  - "GOVERNANCE.md"
  - "SECURITY.md"
  - "MAINTAINERS.md"
  - "RELEASE_NOTES.md"
  - "VERSION.txt"
  - "release-config.yaml"
  - ".editorconfig"
  - "schemas/v2/**"

  # Docs source/build inputs only. Generated docs output is excluded below.
  - "docs/README.md"
  - "docs/CHANGELOG.md"
  - "docs/.gitignore"
  - "docs/docusaurus.config.ts"
  - "docs/package.json"
  - "docs/package-lock.json"
  - "docs/sidebars.ts"
  - "docs/tsconfig.json"
  - "docs/docs/**"
  - "docs/src/**"
  - "docs/static/**"
  - "assets/**"

  # Public verification and examples.
  - "tests/**"
  - "examples/**"

  # Public package source surfaces. Include package metadata, README/license,
  # public schemas/tests/fixtures/source mirrors, and public-safe derivation
  # proofs. Generated package artifacts remain excluded by default.
  - "packages/npm/schema/**"
  - "packages/npm/conformance/**"
  - "packages/npm/core/**"
  - "packages/npm/coordination/**"
  - "packages/npm/integration-llm-http/**"
  - "packages/npm/integration-storage-fs/**"
  - "packages/npm/integration-storage-kv/**"
  - "packages/npm/integration-tools-generic/**"
  - "packages/npm/modules/**"
  - "packages/npm/runtime-minimal/**"
  - "packages/npm/sdk-ts/**"
  - "packages/npm/devtools/**"
  - "packages/pypi/mplp-sdk/**"
  - "packages/sources/sdk-ts/**"
  - "packages/sources/sdk-py/**"

  # Public GitHub surfaces required for normal OSS contribution and security.
  - ".github/ISSUE_TEMPLATE/**"
  - ".github/PULL_REQUEST_TEMPLATE.md"
  - ".github/workflows/deploy-docs.yml"
  - ".github/workflows/codeql.yml"
  # NOTE: Only deploy-docs.yml and codeql.yml allowed in OSS package
  - ".eslintrc.json"

  # Docs build dependency. Other docs/ops and Codex scripts stay internal.
  - "scripts/03-docs/render-mermaid.mjs"
  - ".codeql/**"
  # ============================================================================
  # PUBLIC GOVERNANCE
  # Include public governance principles and selected public-safe records only.
  # Raw Dev/Codex execution, credential, publish, and branch-recovery records are
  # excluded by default and may be represented only by public-safe summaries.
  # ============================================================================
  - "governance/README.md"
  - "governance/EXECUTION_ORDER.md"
  - "governance/01-constitutional/**"
  - "governance/02-methods/**"
  - "governance/03-distribution/sdk/README.md"
