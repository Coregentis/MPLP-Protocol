  # Local workspace noise and root Dev-only files.
  - ".DS_Store"
  - "**/.DS_Store"
  - "This"
  - "AGENTS.md"
  - ".codex/**"
  - ".agents/**"
  - "governance/codex-goals/**"
  - "package-lock.json"
