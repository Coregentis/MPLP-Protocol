  # Version control
  - ".git/**"
  - ".gitignore"
  - ".gitmodules"
  - ".github/workflows/codeql-db/**"
  
  # Development tools
  - "tools/**"
  - "reports/**"
  - "scripts/release/**"
  - "scripts/codex/**"
  - "scripts/03-docs/semantic/**"
  - "scripts/audit/**"
  - "scripts/census/**"
  - "scripts/gates/**"
  - "scripts/semantic/**"
  - "scripts/validate/**"
  - "scripts/evaluator/**"
  - "scripts/99-utils/**"

  # Package artifacts and non-public package surfaces.
